version: '3.8'

services:
  # 1. Redis Service (新增部分)
  redis-server:
    image: redis:7-alpine
    container_name: moon-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - ./redis_data:/data  # 数据持久化，重启不丢失
    command: redis-server --appendonly yes # 开启AOF持久化
    networks:
      - default

  # 2. Java Backend (yudao-server)
  backend:
    build:
      context: ./Payment_Interface
      dockerfile: yudao-server/Dockerfile
    container_name: moon-backend
    ports:
      - '48080:48080'  # 建议写全端口映射
    environment:
      - SPRING_PROFILES_ACTIVE=local
      # 指向上面定义的服务名 "redis-server"
      - SPRING_REDIS_HOST=redis-server
      - SPRING_REDIS_PORT=6379
      # 如果你的 Redis 需要密码，取消下面这行的注释并填入密码
      # - SPRING_REDIS_PASSWORD=你的密码

      # Database credentials must NOT be hard-coded in git.
      # Provide them via environment variables (e.g. with a .env file on the deployment machine).
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=${SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL}
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME=${SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME}
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD=${SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD}
    depends_on:
      - redis-server
    networks:
      - default

  # 3. Next.js Frontend
  frontend:
    build:
      context: ./moon-agent
      dockerfile: Dockerfile
    container_name: moon-frontend
    # Runtime environment variables (required by NextAuth middleware and /api/chat route).
    # Note: NEXT_PUBLIC_* values are also baked into the client bundle at build time.
    env_file:
      - ./moon-agent/.env.local
    ports:
      - '3824:3824'
    depends_on:
      - backend
    networks:
      - default

# 这里的 networks 块可以删除了，默认情况下所有服务都在同一个 default 网络中互通
