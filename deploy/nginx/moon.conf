##
# Nginx reverse proxy for "same domain, path-based routing"
#
# - "/"         -> Next.js (moon-agent)
# - "/app-api/" -> Spring Boot backend (payment module)
#
# Notes:
# - This file is intended to be included inside the `http {}` block,
#   e.g. via `/etc/nginx/conf.d/*.conf`.
# - Replace upstream servers with your real hostnames/ports (or Docker service names).
##

# WebSocket / HTTP upgrade helper
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream moon_next {
  # Example for Docker: `server moon-agent:3824;`
  server 127.0.0.1:3824;
  keepalive 64;
}

upstream moon_pay_api {
  # Example for Docker: `server pay-backend:48080;`
  server 127.0.0.1:48080;
  keepalive 32;
}

server {
  listen 80;
  server_name moonagent.com.cn;

  # Increase if you have file uploads
  client_max_body_size 20m;

  # Basic gzip (optional)
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;

  ##
  # Backend API: /app-api/*
  #
  # IMPORTANT:
  # - This keeps the "/app-api/..." prefix in the upstream request URI.
  # - If your Spring Boot is mounted at "/" (NOT "/app-api"), change to:
  #     location /app-api/ { proxy_pass http://moon_pay_api/; }
  ##
  location /app-api/ {
    proxy_pass http://moon_pay_api;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  ##
  # Next.js static assets (long-term cache for hashed files)
  ##
  location /_next/static/ {
    proxy_pass http://moon_next;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  ##
  # Everything else -> Next.js
  ##
  location / {
    proxy_pass http://moon_next;
    proxy_http_version 1.1;

    # WebSocket / SSE compatibility
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}


