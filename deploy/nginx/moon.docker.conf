##
# Nginx reverse proxy for Docker Compose network
#
# - "/"         -> Next.js container service: frontend:3824
# - "/app-api/" -> Spring Boot container service: backend:48080
#
# This file is intended to be mounted as `/etc/nginx/conf.d/default.conf`.
##

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream moon_next {
  server frontend:3824;
  keepalive 64;
}

upstream moon_pay_api {
  server backend:48080;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;

  location /app-api/ {
    proxy_pass http://moon_pay_api;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /_next/static/ {
    proxy_pass http://moon_next;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://moon_next;
    proxy_http_version 1.1;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}


